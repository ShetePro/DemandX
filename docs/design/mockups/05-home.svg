<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520"
     style="--fg:#18181b;--muted:#71717a;--border:#d4d4d8;--accent:#2563eb;--success:#15803d;--warning:#b45309;--error:#b91c1c;--c1:#0284c7;--c2:#7c3aed;--c4:#0f766e"
     font-family="system-ui, -apple-system, sans-serif">
  <rect width="980" height="520" fill="#ffffff"/>
  <rect x="8" y="8" width="964" height="504" rx="12" fill="none" stroke="var(--border)"/>
  <line x1="228" y1="8" x2="228" y2="504" stroke="var(--border)"/>
  <text x="28" y="42" font-size="15" font-weight="600" fill="var(--fg)">DemandX</text>
  <rect x="20" y="60" width="188" height="32" rx="8" fill="none" stroke="var(--border)"/>
  <text x="38" y="80" font-size="12" fill="var(--fg)">＋ 新建研究</text>
  <text x="28" y="122" font-size="10" fill="var(--muted)">最近线程</text>
  <text x="28" y="148" font-size="11" fill="var(--fg)">跨境卖家库存同步</text>
  <text x="28" y="174" font-size="11" fill="var(--muted)">记账 App 机会</text>
  <text x="28" y="200" font-size="11" fill="var(--muted)">宠物健康订阅</text>
  <text x="28" y="486" font-size="11" fill="var(--muted)">设置</text>

  <text x="252" y="44" font-size="16" font-weight="600" fill="var(--fg)">工作台</text>
  <text x="252" y="64" font-size="10" fill="var(--muted)">所有研究都在本机运行，数据不出机器</text>
  <rect x="792" y="28" width="152" height="30" rx="8" fill="none" stroke="var(--accent)"/>
  <text x="808" y="47" font-size="10" fill="var(--accent)">开始一次新研究</text>

  <text x="252" y="100" font-size="10" fill="var(--muted)">试试这些方向</text>
  <rect x="252" y="110" width="176" height="26" rx="13" fill="none" stroke="var(--border)"/>
  <text x="266" y="127" font-size="9" fill="var(--muted)">跨境库存同步</text>
  <rect x="436" y="110" width="150" height="26" rx="13" fill="none" stroke="var(--border)"/>
  <text x="450" y="127" font-size="9" fill="var(--muted)">小团队发票管理</text>
  <rect x="594" y="110" width="160" height="26" rx="13" fill="none" stroke="var(--border)"/>
  <text x="608" y="127" font-size="9" fill="var(--muted)">小红书选题工具</text>

  <text x="252" y="166" font-size="9" fill="var(--muted)">研究方向</text>
  <text x="520" y="166" font-size="9" fill="var(--muted)">状态</text>
  <text x="620" y="166" font-size="9" fill="var(--muted)">结论</text>
  <text x="772" y="166" font-size="9" fill="var(--muted)">总分 / 可信度</text>
  <text x="900" y="166" font-size="9" fill="var(--muted)">更新</text>
  <line x1="252" y1="176" x2="948" y2="176" stroke="var(--border)"/>

  <text x="252" y="200" font-size="11" fill="var(--fg)">跨境卖家多平台库存同步</text>
  <rect x="520" y="188" width="58" height="18" rx="9" fill="none" stroke="var(--accent)"/>
  <text x="530" y="201" font-size="9" fill="var(--accent)">进行中</text>
  <text x="620" y="200" font-size="10" fill="var(--muted)">—</text>
  <text x="772" y="200" font-size="10" fill="var(--muted)">— / —</text>
  <text x="900" y="200" font-size="10" fill="var(--muted)">2 分钟前</text>

  <line x1="252" y1="212" x2="948" y2="212" stroke="var(--border)"/>
  <text x="252" y="236" font-size="11" fill="var(--fg)">独立开发者发票与报销</text>
  <rect x="520" y="224" width="58" height="18" rx="9" fill="none" stroke="var(--success)"/>
  <text x="530" y="237" font-size="9" fill="var(--success)">已完成</text>
  <text x="620" y="236" font-size="10" fill="var(--fg)">建议先验证</text>
  <text x="772" y="236" font-size="10" fill="var(--fg)">71 / B</text>
  <text x="900" y="236" font-size="10" fill="var(--muted)">昨天</text>

  <line x1="252" y1="248" x2="948" y2="248" stroke="var(--border)"/>
  <text x="252" y="272" font-size="11" fill="var(--fg)">宠物健康订阅盒</text>
  <rect x="520" y="260" width="58" height="18" rx="9" fill="none" stroke="var(--error)"/>
  <text x="530" y="273" font-size="9" fill="var(--error)">已放弃</text>
  <text x="620" y="272" font-size="10" fill="var(--fg)">建议放弃</text>
  <text x="772" y="272" font-size="10" fill="var(--fg)">34 / D</text>
  <text x="900" y="272" font-size="10" fill="var(--muted)">3 天前</text>

  <line x1="252" y1="284" x2="948" y2="284" stroke="var(--border)"/>
  <text x="252" y="308" font-size="11" fill="var(--fg)">小红书选题与竞品监控</text>
  <rect x="520" y="296" width="58" height="18" rx="9" fill="none" stroke="var(--warning)"/>
  <text x="530" y="309" font-size="9" fill="var(--warning)">部分完成</text>
  <text x="620" y="308" font-size="10" fill="var(--fg)">证据不足</text>
  <text x="772" y="308" font-size="10" fill="var(--fg)">52 / C</text>
  <text x="900" y="308" font-size="10" fill="var(--muted)">5 天前</text>
  <line x1="252" y1="320" x2="948" y2="320" stroke="var(--border)"/>

  <text x="252" y="356" font-size="9" fill="var(--muted)">“部分完成”= 采集被配额或登录墙中断，结论标记为待验证</text>
</svg>
