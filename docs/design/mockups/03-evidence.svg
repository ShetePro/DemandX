  <line x1="8" y1="64" x2="972" y2="64" stroke="var(--border)"/>
  <rect x="28" y="78" width="88" height="26" rx="13" fill="none" stroke="var(--accent)"/>
  <text x="42" y="95" font-size="10" fill="var(--accent)">信号：全部</text>
  <rect x="124" y="78" width="88" height="26" rx="13" fill="none" stroke="var(--border)"/>
