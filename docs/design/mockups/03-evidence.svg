  <text x="268" y="230" font-size="10" fill="var(--fg)">正在找 ERP 的替代品</text>
  <text x="548" y="230" font-size="9" fill="var(--muted)">待确认</text>

  <rect x="28" y="248" width="46" height="20" rx="6" fill="none" stroke="var(--border)"/>
  <text x="36" y="262" font-size="9" fill="var(--muted)">持续</text>
  <text x="104" y="262" font-size="10" fill="var(--muted)">App Store</text>
  <text x="180" y="262" font-size="10" fill="var(--muted)">03-11</text>
  <text x="268" y="262" font-size="10" fill="var(--fg)">续费三年，但缺少多平台同步</text>
  <text x="548" y="262" font-size="9" fill="var(--muted)">已确认</text>

  <rect x="28" y="280" width="46" height="20" rx="6" fill="none" stroke="var(--error)"/>
  <text x="36" y="294" font-size="9" fill="var(--error)">驳回</text>
  <text x="104" y="294" font-size="10" fill="var(--muted)">知乎</text>
  <text x="180" y="294" font-size="10" fill="var(--muted)">03-14</text>
  <text x="268" y="294" font-size="10" fill="var(--muted)">引文不在快照中，已拒绝</text>
  <text x="548" y="294" font-size="9" fill="var(--error)">quote 校验失败</text>

  <text x="28" y="330" font-size="9" fill="var(--muted)">仅显示前 5 行；滚动时虚拟化，>200 行仍 60fps</text>

  <rect x="664" y="76" width="300" height="520" rx="10" fill="none" stroke="var(--border)"/>
  <text x="680" y="102" font-size="12" font-weight="600" fill="var(--fg)">证据 e12</text>
  <text x="924" y="102" font-size="12" fill="var(--muted)">×</text>
  <text x="680" y="124" font-size="9" fill="var(--muted)">小红书 · 2026-02-18 · 一手</text>

  <rect x="680" y="138" width="268" height="110" rx="8" fill="none" stroke="var(--border)"/>
  <text x="692" y="160" font-size="10" fill="var(--fg)">“三个平台改库存改到凌晨，</text>
  <text x="692" y="178" font-size="10" fill="var(--fg)">每次都怕超卖，平台又不同步。”</text>
  <rect x="690" y="172" width="240" height="16" rx="3" fill="none" stroke="var(--accent)"/>
  <text x="692" y="212" font-size="9" fill="var(--muted)">quote 已在快照中定位（offset 412）</text>

  <text x="680" y="274" font-size="10" font-weight="600" fill="var(--fg)">支持什么</text>
  <text x="680" y="292" font-size="9" fill="var(--muted)">多平台库存同步是高频痛点</text>
  <text x="680" y="318" font-size="10" font-weight="600" fill="var(--fg)">不能证明</text>
  <text x="680" y="336" font-size="9" fill="var(--muted)">愿意为工具付费</text>

  <line x1="680" y1="356" x2="948" y2="356" stroke="var(--border)"/>
  <text x="680" y="378" font-size="9" fill="var(--muted)">信号</text>
  <rect x="720" y="366" width="46" height="18" rx="6" fill="none" stroke="var(--accent)"/>
  <text x="728" y="379" font-size="9" fill="var(--accent)">需要</text>
  <text x="680" y="406" font-size="9" fill="var(--muted)">价格：未提及</text>
  <text x="680" y="426" font-size="9" fill="var(--muted)">快照：data/snapshots/8f2c….gz</text>

  <rect x="680" y="448" width="120" height="28" rx="6" fill="none" stroke="var(--success)"/>
  <text x="700" y="466" font-size="10" fill="var(--success)">确认有效</text>
  <rect x="810" y="448" width="90" height="28" rx="6" fill="none" stroke="var(--border)"/>
  <text x="826" y="466" font-size="10" fill="var(--muted)">驳回</text>
  <text x="680" y="500" font-size="9" fill="var(--muted)">驳回会写 rejected_reason=manual 并重算评分</text>
