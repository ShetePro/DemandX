  <rect x="220" y="78" width="76" height="26" rx="13" fill="none" stroke="var(--border)"/>
  <text x="234" y="95" font-size="10" fill="var(--muted)">仅一手</text>
  <rect x="304" y="78" width="92" height="26" rx="13" fill="none" stroke="var(--border)"/>
  <text x="318" y="95" font-size="10" fill="var(--muted)">含价格</text>
  <text x="412" y="95" font-size="9" fill="var(--muted)">URL 同步：?signal=paying</text>

  <text x="28" y="132" font-size="9" fill="var(--muted)">信号</text>
  <text x="104" y="132" font-size="9" fill="var(--muted)">平台</text>
  <text x="180" y="132" font-size="9" fill="var(--muted)">时间</text>
  <text x="268" y="132" font-size="9" fill="var(--muted)">原文摘要</text>
  <text x="548" y="132" font-size="9" fill="var(--muted)">状态</text>
  <line x1="28" y1="142" x2="650" y2="142" stroke="var(--border)"/>

