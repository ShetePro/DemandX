  <text x="180" y="198" font-size="10" fill="var(--muted)">02-18</text>
  <text x="268" y="198" font-size="10" fill="var(--fg)">三个平台改库存改到凌晨</text>
  <text x="548" y="198" font-size="9" fill="var(--muted)">待确认</text>

  <rect x="28" y="216" width="46" height="20" rx="6" fill="none" stroke="var(--warning)"/>
