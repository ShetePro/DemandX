  <text x="180" y="166" font-size="10" fill="var(--muted)">01-07</text>
  <text x="268" y="166" font-size="10" fill="var(--fg)">已经付费 399/月，觉得太贵</text>
  <text x="548" y="166" font-size="9" fill="var(--muted)">已确认</text>

  <rect x="28" y="184" width="46" height="20" rx="6" fill="none" stroke="var(--accent)"/>
